name: Generate 3D Contribution Heatmap

on:
  schedule:
    - cron: "0 0 * * *"   # Runs daily at midnight UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate 3D Contribution Graph

    steps:
      - uses: actions/checkout@v3

      - name: Create settings file
        run: |
          cat << 'EOF' > profile-night-rainbow.json
          {
            "githubUserName": "ayushj0704",
            "fileName": "profile-night-rainbow.svg",
            "type": "isometric",
            "settings": {
              "theme": "night-rainbow"
            }
          }
          EOF

      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ayushj0704
          SETTING_JSON: ./profile-night-rainbow.json

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/
          git commit -m "Update 3D contribution heatmap" || exit 0
          git push
